runtime: nodejs22   # required field; not actually run for pure static serving
service: web

automatic_scaling:
  max_instances: 2

handlers:
  # Hashed asset files are immutable (name changes per build) — cache hard.
  - url: /assets
    static_dir: dist/assets
    secure: always
    expiration: "365d"

  # Serve any other real file at the root (favicon, vite.svg, etc.).
  - url: /(.*\.(ico|png|svg|txt|json|webmanifest))$
    static_files: dist/\1
    upload: dist/.*\.(ico|png|svg|txt|json|webmanifest)$
    secure: always

  # SPA catch-all: every other path serves index.html so React Router works.
  # expiration 0 → App Engine sends no-cache, so a new deploy is picked up
  # immediately (the shell references freshly-hashed JS/CSS, cached forever above).
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    expiration: "0s"