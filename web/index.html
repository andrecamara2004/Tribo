<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/TriboLogo_NoBackground.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Tribo</title>
    <!-- Instant boot loader: shown before the JS bundle mounts React, then
         replaced when the app renders into #root. Self-contained so it needs no
         app CSS. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #6b7280;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 500;
      }
      .boot .ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: conic-gradient(from 90deg, rgba(0, 184, 107, 0) 0%, #00b86b 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #0f1115;
          color: #9aa0aa;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="ring"></div>
        Loading Tribo…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
